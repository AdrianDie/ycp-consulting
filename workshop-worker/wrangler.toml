name = "ycp-workshop-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (set with `wrangler secret put <NAME>`, never in this file):
#   ANTHROPIC_API_KEY   - your Anthropic API key
#   WORKSHOP_ACCESS_KEY - a shared code you give out at the start of each live workshop,
#                         so the API key behind this Worker can't be scraped and abused
#                         by someone who just finds the tool's URL.

[vars]
# Comma-separated list of origins allowed to call this Worker.
# Update this if the site's domain changes.
ALLOWED_ORIGINS = "https://adriandie.github.io,http://localhost:8931,http://localhost:8000"
